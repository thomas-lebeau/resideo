name: Dashboard

# Tests the web dashboard on pull requests and pushes to main that change it, and
# deploys it to Vercel (production) when it changes on main. Setup: see dashboard/README.md.
# Keep both path filters in sync with `paths` in .github/scripts/dashboard-is-latest.sh:
# a deploy skipped as outdated relies on the newer commit having started its own run.
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"
      - ".github/scripts/dashboard-is-latest.sh"
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"
      - ".github/scripts/dashboard-is-latest.sh"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: dashboard

env:
  VERCEL_TELEMETRY_DISABLED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    # PRs share a group so a new push cancels the outdated run. Other runs get their own
    # group: GitHub keeps only one pending run per group, so a shared group on main could
    # let a re-run cancel the newest pending test.
    concurrency:
      group: dashboard-test-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.8.0"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Builds the real Vercel output offline (no token: a placeholder project link
      # is enough for `vercel build`), then imports and calls the emitted function.
      # This catches output-only breakage, e.g. `.ts` imports left in emitted JS.
      - name: Build the Vercel output
        run: |
          mkdir -p .vercel
          echo '{"projectId":"prj_ci","orgId":"team_ci","settings":{"framework":"vite"}}' > .vercel/project.json
          npm run vercel -- build

      - name: Smoke test the built function
        run: npm run smoke:function

  # Decides whether this run may deploy, before it joins the deploy queue: an outdated
  # run (e.g. a re-run of an old commit) is skipped here, so it can neither roll
  # production back nor take the queue's single pending slot from a newer deploy.
  latest:
    # Production only: pushes to main, or a manual run on main. PRs are tested, not deployed.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check this is the latest dashboard revision
        id: check
        working-directory: .
        run: .github/scripts/dashboard-is-latest.sh

  deploy:
    needs: [test, latest]
    if: needs.latest.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # Never cancel a production deploy half-way; queue the next one instead.
    concurrency:
      group: dashboard-deploy
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.8.0"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      # Installs the pinned Vercel CLI from devDependencies.
      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel project settings and production env
        run: npm run vercel -- pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: npm run vercel -- build --prod --token="$VERCEL_TOKEN"

      - name: Smoke test the built function
        run: npm run smoke:function

      # main may have moved on while this run was testing or queued: check again right
      # before deploying, so an older revision never replaces a newer one.
      - name: Re-check this is still the latest dashboard revision
        id: recheck
        working-directory: .
        run: .github/scripts/dashboard-is-latest.sh

      # The production URL is printed in this step's log.
      - name: Deploy
        if: steps.recheck.outputs.deploy == 'true'
        run: npm run vercel -- deploy --prebuilt --prod --token="$VERCEL_TOKEN"
