name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing draft release tag to recover after a failed release run (for example, v4.1.0)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag_name == '' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Annotate secondary changelog entries
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          PR_BRANCH="$(gh pr list --state open --base main --json headRefName,title --jq '[.[] | select(.title | test("release"; "i"))][0].headRefName // empty')"
          if [ -z "$PR_BRANCH" ]; then
            echo "No open Release Please PR found."
            exit 0
          fi

          git fetch origin "$PR_BRANCH"
          git checkout -B "$PR_BRANCH" FETCH_HEAD
          node scripts/annotate-release-changelog.mjs

          if git diff --quiet -- CHANGELOG.md; then
            echo "Changelog already has type labels."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: annotate secondary changelog entries"
          git push origin "HEAD:$PR_BRANCH"

  build:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')) }}
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.tag_name != '' && inputs.tag_name || needs.release-please.outputs.tag_name }}
      upload: true

  publish-assets:
    needs: [release-please, build]
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')) && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4

      - name: Attach release archives
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name || inputs.tag_name }}
        run: |
          gh release upload "$TAG_NAME" raspberry-home-monitor-linux-x64/raspberry-home-monitor-linux-x64.tar.gz raspberry-home-monitor-linux-armv7/raspberry-home-monitor-linux-armv7.tar.gz raspberry-home-monitor-linux-arm64/raspberry-home-monitor-linux-arm64.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name || inputs.tag_name }}
        run: gh release edit "$TAG_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
