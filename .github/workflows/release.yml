name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: "patch"

permissions:
  contents: write

# Nothing is pushed until both builds pass: the builds use the new version
# locally, and the `release` job commits the bump, tags it and pushes both at
# once. If a build fails, `main` and the tags are left untouched.
jobs:
  version_bump:
    if: github.actor == 'thomas-lebeau' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      new_version: ${{ steps.version.outputs.new_version }}
      previous_version: ${{ steps.version.outputs.previous_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.8.0"

      - name: Compute next version
        id: version
        env:
          VERSION_BUMP: ${{ github.event.inputs.version_bump }}
        run: |
          PREVIOUS_VERSION=$(node -p "require('./package.json').version")
          npm version "$VERSION_BUMP" --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "previous_version=$PREVIOUS_VERSION" >> $GITHUB_OUTPUT

  build-linux-x64:
    needs: version_bump
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.8.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build binary
        env:
          NEW_VERSION: ${{ needs.version_bump.outputs.new_version }}
        run: |
          npm version "$NEW_VERSION" --no-git-tag-version
          npm run build

      - name: Create release archive
        run: |
          mkdir -p release
          cp bin/raspberry-home-monitor release/
          cp scripts/raspberry-home-monitor.service release/
          chmod +x release/raspberry-home-monitor
          cp -r node_modules release/
          cd release
          tar -czf ../raspberry-home-monitor-linux-x64.tar.gz raspberry-home-monitor raspberry-home-monitor.service node_modules

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raspberry-home-monitor-linux-x64
          path: raspberry-home-monitor-linux-x64.tar.gz

  build-linux-arm:
    needs: version_bump
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: armv7
            platform: linux/arm/v7
          - arch: arm64
            platform: linux/arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build for ${{ matrix.arch }}
        env:
          NEW_VERSION: ${{ needs.version_bump.outputs.new_version }}
        run: |
          docker run --rm -v $PWD:/app -w /app -e NEW_VERSION --platform ${{ matrix.platform }} node:18-buster bash -c "
            sed -i 's|deb.debian.org/debian|archive.debian.org/debian|g' /etc/apt/sources.list &&
            sed -i 's|security.debian.org|archive.debian.org/debian-security|g' /etc/apt/sources.list &&
            sed -i '/stretch-updates/d' /etc/apt/sources.list &&
            apt update &&
            apt install -y bluetooth bluez libbluetooth-dev libudev-dev build-essential python3 make g++ git &&
            git config --global --add safe.directory /app &&
            npm ci --build-from-source &&
            npm version \"\$NEW_VERSION\" --no-git-tag-version &&
            npm run build
          "
      - name: Create release archive
        run: |
          mkdir -p release
          cp bin/raspberry-home-monitor release/
          cp scripts/raspberry-home-monitor.service release/
          chmod +x release/raspberry-home-monitor
          cp -r node_modules release/
          cd release
          tar -czf ../raspberry-home-monitor-linux-${{ matrix.arch }}.tar.gz raspberry-home-monitor raspberry-home-monitor.service node_modules

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raspberry-home-monitor-linux-${{ matrix.arch }}
          path: raspberry-home-monitor-linux-${{ matrix.arch }}.tar.gz

  release:
    needs: [version_bump, build-linux-x64, build-linux-arm]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.8.0"

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      # Atomic, non-force push: if `main` moved since the workflow started, the
      # push is rejected and nothing (neither the bump nor the tag) is published.
      - name: Commit, tag and push version bump
        env:
          NEW_VERSION: ${{ needs.version_bump.outputs.new_version }}
          TAG: ${{ needs.version_bump.outputs.tag }}
        run: |
          npm version "$NEW_VERSION" --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "chore: release $TAG"
          git tag "$TAG"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG="v${{ needs.version_bump.outputs.previous_version }}"
          CURRENT_TAG="${{ needs.version_bump.outputs.tag }}"

          git log $PREVIOUS_TAG..$CURRENT_TAG~1 --pretty=format:"- %s (%h)" --no-merges >> changelog.md
          echo "" >> changelog.md
          echo "[Full Changelog](https://github.com/thomas-lebeau/resideo/compare/$PREVIOUS_TAG...$CURRENT_TAG)" >> changelog.md

          cat changelog.md

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version_bump.outputs.tag }}
          name: Release ${{ needs.version_bump.outputs.tag }}
          fail_on_unmatched_files: true
          body_path: changelog.md
          files: |
            raspberry-home-monitor-linux-x64/raspberry-home-monitor-linux-x64.tar.gz
            raspberry-home-monitor-linux-armv7/raspberry-home-monitor-linux-armv7.tar.gz
            raspberry-home-monitor-linux-arm64/raspberry-home-monitor-linux-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
